apply plugin: 'com.android.application'

android {
    namespace = 'org.example.dateiprobe'
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = '35.0.0'
    defaultConfig {
        applicationId 'org.example.dateiprobe'
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    dependenciesInfo {
        includeInApk = false
    }
}

// Keine Bibliotheksabhängigkeiten: Activity, DocumentsProvider und JSON sind
// Bestandteile des Android-Frameworks auf allen unterstützten Testabbildern.
