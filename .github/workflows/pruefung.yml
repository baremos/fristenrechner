# Prüfung bei jedem Pull Request und jedem Push nach main.
# Tests, Typprüfung, Build und Lizenzprüfung mit den festgelegten Werkzeugversionen:
# Node.js nach scripts/toolchain.json (Archiv mit Prüfsumme über scripts/node-einrichten.sh)
# und das JDK 21 des Runners. Android-Build und Emulator laufen hier nicht.
name: Prüfung

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefung:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js nach scripts/toolchain.json einrichten
        run: |
          version=$(jq -r '.node.referenz' scripts/toolchain.json)
          bash scripts/node-einrichten.sh --ziel "$RUNNER_TEMP/node"
          echo "$RUNNER_TEMP/node/node-v$version-linux-x64/bin" >> "$GITHUB_PATH"

      - name: JDK 21 des Runners verwenden
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java" || { echo "JDK 21 fehlt auf dem Runner."; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Werkzeugversionen
        run: |
          node --version
          npm --version
          "$JAVA_HOME/bin/java" -version

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typprüfung
        run: npm run check

      - name: Build
        run: npm run build

      - name: Lizenzprüfung
        run: npm run lizenzen

      - name: Arbeitskopie unverändert
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi
